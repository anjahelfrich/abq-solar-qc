[project]
name = "abq-qc"
version = "0.1.0"
description = "QC and traceability pipeline for NOAA SOLRAD Albuquerque 1-minute irradiance data"
authors = [
    { name = "Anja Helfrich" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.28",
    "duckdb>=2.0.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "pytz>=2026.6",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagster-webserver>=1.13.28",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["dashboard"]
addopts = "-ra"
# DuckDB's .df() triggers this inside its own code when pyarrow is installed (via streamlit).
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop:pandas.errors.Pandas4Warning"]
